name: Validate plugin
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Page script behavior
        run: node tests/header-fix-test.js
      - name: Verify committed package and CA metadata
        run: |
          python3 tests/package-test.py
          python3 tests/ca-metadata-test.py
      - name: Rebuild without changing committed artifacts
        run: |
          python3 build/package.py --no-publish
          python3 tests/package-test.py dist/header-fix.plg
          python3 tests/reproducible-package-test.py
