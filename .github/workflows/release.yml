name: Release

on:
  release:
    types:
      - released

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: dkaser/unraid-plugin-release-action@946d02c81dd87c252e5a06d18f3e74b2ecc401dc # v1.5.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
